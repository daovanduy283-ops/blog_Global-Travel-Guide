<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Travel Guide</title>
<meta name="description" content="Companion video blog for the Global Travel Guide YouTube channel — country documentaries, synced automatically.">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef0e6;
    --paper-raised:#ffffff;
    --ink:#17231f;
    --ink-soft:#4d5b52;
    --line:#cdd0bd;
    --brass:#a5721f;
    --brass-ink:#7a5518;
    --teal:#1f4a48;
    --teal-ink:#ffffff;
    --shadow: 0 1px 0 rgba(23,35,31,.05), 0 8px 24px -16px rgba(23,35,31,.35);
    --yt:#e02929;
    --yt-ink:#ffffff;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111712;
      --paper-raised:#182019;
      --ink:#eceee3;
      --ink-soft:#a4ac9d;
      --line:#2c352c;
      --brass:#dba748;
      --brass-ink:#1a1400;
      --teal:#4a938c;
      --teal-ink:#08201d;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.6);
      --yt:#ff4b4b;
      --yt-ink:#1a0000;
      color-scheme: dark;
    }
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    padding-inline: max(16px, calc((100% - 1160px)/2));
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  h1,h2,h3{font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0; letter-spacing:-.01em;}
  .mono{font-family:"Space Mono", ui-monospace, monospace;}
  .u{text-transform:uppercase; letter-spacing:.08em;}

  header.site{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding-block:14px;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; margin-right:auto;}
  .brand img{width:38px; height:38px; border-radius:50%; object-fit:cover; border:1px solid var(--line);}
  .brand span{font-family:"Fraunces", serif; font-weight:600; font-size:1.15rem;}
  nav.site{display:flex; gap:4px; align-items:center;}
  nav.site a{
    padding:8px 12px; border-radius:999px; text-decoration:none;
    font-size:.92rem; font-weight:500; color:var(--ink-soft);
  }
  nav.site a.active{color:var(--ink); background:var(--paper-raised); box-shadow:var(--shadow);}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:999px; text-decoration:none;
    font-weight:600; font-size:.92rem; border:1px solid transparent; cursor:pointer;
    white-space:nowrap;
  }
  .btn-yt{background:var(--yt); color:var(--yt-ink);}
  .btn-brass{background:var(--brass); color:var(--brass-ink);}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn:hover{filter:brightness(1.06);}
  .btn svg{width:16px;height:16px;fill:currentColor;flex:none;}

  header.site .actions{display:flex; gap:8px; order:2;}
  header.site .actions .btn span.long{display:inline;}
  @media (max-width:640px){
    header.site .actions .btn span.long{display:none;}
    header.site .actions .btn{padding:10px 12px;}
  }
  @media (max-width:460px){
    header.site{flex-wrap:wrap; row-gap:10px;}
    .brand{order:1;}
    header.site .actions{order:2;}
    nav.site{order:3; flex:1 1 100%; justify-content:flex-start; margin-left:-4px;}
  }

  .hero{
    display:grid; grid-template-columns:1.1fr .9fr; gap:40px;
    align-items:center; padding-block:56px 40px;
    border-bottom:1px solid var(--line);
  }
  .hero .eyebrow{color:var(--brass); font-weight:700; font-size:.8rem;}
  .hero h1{font-size:clamp(2rem, 4vw, 3.1rem); line-height:1.05; margin-block:14px 16px;}
  .hero p{color:var(--ink-soft); font-size:1.05rem; line-height:1.6; max-width:52ch;}
  .hero .cta{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;}
  .hero-stat{margin-top:28px; display:flex; gap:22px; flex-wrap:wrap;}
  .hero-stat div{display:flex; flex-direction:column; gap:2px;}
  .hero-stat b{font-family:"Fraunces",serif; font-size:1.5rem;}
  .hero-stat span{font-size:.78rem; color:var(--ink-soft);}
  .hero-art{
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--line);
    box-shadow:var(--shadow); aspect-ratio:4/3;
  }
  .hero-art img{width:100%; height:100%; object-fit:cover;}
  .hero-art .stamp{
    position:absolute; top:14px; left:14px;
    background:color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter:blur(4px);
    border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:.72rem;
  }
  @media (max-width:820px){ .hero{grid-template-columns:1fr; padding-block:36px 28px;} }

  section.block{padding-block:44px;}
  section.block + section.block{border-top:1px solid var(--line);}
  .block-head{display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:24px; flex-wrap:wrap;}
  .block-head h2{font-size:clamp(1.4rem,2.4vw,1.9rem);}
  .block-head .see-all{font-size:.88rem; font-weight:600; color:var(--teal); text-decoration:none; white-space:nowrap;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:22px;}
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow); text-decoration:none; color:var(--ink);
    display:flex; flex-direction:column;
    transition:transform .15s ease;
  }
  .card:hover{transform:translateY(-3px);}
  @media (prefers-reduced-motion:reduce){ .card{transition:none;} .card:hover{transform:none;} }
  .card .thumb{position:relative; aspect-ratio:16/9; background:var(--line); overflow:hidden;}
  .card .thumb img{width:100%; height:100%; object-fit:cover;}
  .card .tag{
    position:absolute; left:10px; top:10px;
    background:var(--teal); color:var(--teal-ink);
    font-size:.68rem; font-weight:700; letter-spacing:.06em;
    padding:4px 9px; border-radius:6px;
  }
  .card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card h3{font-size:1.02rem; line-height:1.32; font-weight:600; font-family:"Work Sans",sans-serif;}
  .card .excerpt{font-size:.82rem; color:var(--ink-soft); line-height:1.45; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .card .meta{display:flex; justify-content:space-between; color:var(--ink-soft); font-size:.74rem; margin-top:auto;}

  .card.featured{grid-column: span 2;}
  .card.featured .thumb{aspect-ratio:21/9;}
  .card.featured h3{font-size:1.35rem; font-family:"Fraunces",serif; font-weight:600;}
  @media (max-width:820px){ .card.featured{grid-column:span 1;} }

  .band{
    background:var(--teal); color:var(--teal-ink); border-radius:20px;
    padding:36px; display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap;
    margin-block:8px 44px;
  }
  .band h2{color:var(--teal-ink); font-size:1.5rem;}
  .band p{color:color-mix(in srgb, var(--teal-ink) 80%, transparent); margin-top:6px; max-width:46ch;}
  .band .btn-ghost{border-color:color-mix(in srgb, var(--teal-ink) 40%, transparent); color:var(--teal-ink);}

  .back{display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); text-decoration:none; font-size:.88rem; margin-block:20px 18px;}
  .detail-hero{border-radius:20px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow); aspect-ratio:16/9; position:relative;}
  .detail-hero img{width:100%; height:100%; object-fit:cover;}
  .detail-hero .play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,0) 55%);
    text-decoration:none;
  }
  .play-btn{
    width:74px; height:74px; border-radius:50%; background:var(--yt); color:var(--yt-ink);
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px -8px rgba(0,0,0,.6);
  }
  .play-btn svg{width:28px; height:28px; margin-left:4px;}
  .detail-title{font-size:clamp(1.6rem,3.4vw,2.4rem); margin-block:22px 10px;}
  .detail-tag{display:inline-block; background:var(--teal); color:var(--teal-ink); font-size:.72rem; font-weight:700; letter-spacing:.06em; padding:4px 10px; border-radius:6px; margin-bottom:14px;}
  .detail-meta{display:flex; gap:18px; flex-wrap:wrap; color:var(--ink-soft); font-size:.85rem; margin-bottom:10px;}
  .detail-excerpt{color:var(--ink-soft); line-height:1.6; max-width:70ch; margin-bottom:22px;}
  .detail-cta{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:48px;}

  footer.site{border-top:1px solid var(--line); padding-block:32px; margin-top:20px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; color:var(--ink-soft); font-size:.82rem;}
  footer.site a{color:var(--ink-soft); text-decoration:underline;}

  .page-head{padding-block:40px 8px;}
  .page-head .eyebrow{color:var(--brass); font-weight:700; font-size:.8rem;}
  .page-head h1{font-size:clamp(1.8rem,3.4vw,2.6rem); margin-block:10px 8px;}
  .page-head p{color:var(--ink-soft); max-width:60ch;}

  .state{padding-block:80px; text-align:center; color:var(--ink-soft);}

  [hidden]{display:none!important;}
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="#/">
    <img src="logo.jpg" alt="Global Travel Guide logo">
    <span>Global Travel Guide</span>
  </a>
  <nav class="site" id="mainNav">
    <a href="#/" data-route="home">Home</a>
    <a href="#/videos" data-route="videos">Latest Videos</a>
  </nav>
  <div class="actions">
    <a class="btn btn-ghost" target="_blank" rel="noopener" href="https://www.youtube.com/@GlobalTravelGuide-68">
      <svg viewBox="0 0 24 24"><path d="M21.6 7.2s-.2-1.5-.8-2.2c-.8-.9-1.7-.9-2.1-1C15.9 3.8 12 3.8 12 3.8h0s-3.9 0-6.7.2c-.4 0-1.3.1-2.1 1-.6.7-.8 2.2-.8 2.2S2.2 9 2.2 10.7v1.5c0 1.8.2 3.5.2 3.5s.2 1.5.8 2.2c.8.9 1.9.9 2.4 1 1.7.2 7.4.2 7.4.2s3.9 0 6.7-.2c.4 0 1.3-.1 2.1-1 .6-.7.8-2.2.8-2.2s.2-1.8.2-3.5v-1.5c0-1.8-.2-3.5-.2-3.5zM9.9 14.6V8.4l5.8 3.1z"/></svg>
      <span class="long">Watch on YouTube</span>
    </a>
    <a class="btn btn-yt" target="_blank" rel="noopener" href="https://www.youtube.com/@GlobalTravelGuide-68?sub_confirmation=1">Subscribe</a>
  </div>
</header>

<main id="app"><div class="state">Loading…</div></main>

<footer class="site">
  <span>© <span id="year"></span> Global Travel Guide — Country Documentary series. Video content and thumbnails belong to the channel.</span>
  <a target="_blank" rel="noopener" href="https://www.youtube.com/@GlobalTravelGuide-68">youtube.com/@GlobalTravelGuide-68</a>
</footer>

<script>
const CHANNEL_URL = "https://www.youtube.com/@GlobalTravelGuide-68";
const SUB_URL = CHANNEL_URL + "?sub_confirmation=1";
function watchUrl(id){ return "https://www.youtube.com/watch?v=" + id; }

let VIDEOS = [];

function countryTag(title){
  const m = title.match(/life\s+in\s+([a-z0-9\s]+?)[:!|]/i);
  if(!m) return "DISPATCH";
  return m[1].replace(/\b(19|20)\d{2}\b/g, '').trim().toUpperCase();
}
function fmtViews(n){
  if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + "M views";
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + "K views";
  return n + " views";
}
function fmtStamp(iso){
  const d = new Date(iso);
  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  return `${String(d.getUTCDate()).padStart(2,'0')} ${months[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`;
}
function fmtFull(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-US",{month:"long", day:"numeric", year:"numeric", timeZone:"UTC"});
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const watchIcon = `<svg viewBox="0 0 24 24"><path d="M21.6 7.2s-.2-1.5-.8-2.2c-.8-.9-1.7-.9-2.1-1C15.9 3.8 12 3.8 12 3.8h0s-3.9 0-6.7.2c-.4 0-1.3.1-2.1 1-.6.7-.8 2.2-.8 2.2S2.2 9 2.2 10.7v1.5c0 1.8.2 3.5.2 3.5s.2 1.5.8 2.2c.8.9 1.9.9 2.4 1 1.7.2 7.4.2 7.4.2s3.9 0 6.7-.2c.4 0 1.3-.1 2.1-1 .6-.7.8-2.2.8-2.2s.2-1.8.2-3.5v-1.5c0-1.8-.2-3.5-.2-3.5zM9.9 14.6V8.4l5.8 3.1z"/></svg>`;
const playIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

function cardHTML(v, featured){
  return `<a class="card${featured?' featured':''}" href="#/video/${v.id}">
    <div class="thumb"><img loading="lazy" src="${v.thumbnail}" alt="${esc(v.title)}"><span class="tag">${countryTag(v.title)}</span></div>
    <div class="body">
      <h3>${esc(v.title)}</h3>
      ${v.excerpt ? `<div class="excerpt">${esc(v.excerpt)}</div>` : ""}
      <div class="meta"><span class="mono">${fmtStamp(v.published)}</span><span>${fmtViews(v.views)}</span></div>
    </div>
  </a>`;
}

function renderHome(){
  const latest = VIDEOS[0];
  const recent = VIDEOS.slice(1,7);
  return `
  <section class="hero">
    <div>
      <div class="eyebrow u">Country Documentary Series</div>
      <h1>Real life, real places — one documentary at a time.</h1>
      <p>Global Travel Guide goes past the landmarks to show how people actually live: hidden cultures, local traditions, street food, and the everyday realities most travelers never see.</p>
      <div class="cta">
        <a class="btn btn-yt" target="_blank" rel="noopener" href="${CHANNEL_URL}">${watchIcon}Watch on YouTube</a>
        <a class="btn btn-brass" target="_blank" rel="noopener" href="${SUB_URL}">Subscribe</a>
      </div>
      <div class="hero-stat">
        <div><b>${VIDEOS.length}</b><span>Country documentaries</span></div>
        <div><b>4K</b><span>Filmed worldwide</span></div>
        <div><b class="mono">${fmtStamp(latest.published)}</b><span>Latest dispatch</span></div>
      </div>
    </div>
    <a class="hero-art" href="#/video/${latest.id}">
      <img src="${latest.thumbnail}" alt="${esc(latest.title)}">
      <span class="stamp mono">${countryTag(latest.title)} · ${fmtStamp(latest.published)}</span>
    </a>
  </section>

  <section class="block">
    <div class="block-head"><h2>Latest dispatch</h2></div>
    <div class="grid">${cardHTML(latest, true)}</div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>Recent dispatches</h2>
      <a class="see-all" href="#/videos">View all documentaries →</a>
    </div>
    <div class="grid">${recent.map(v => cardHTML(v)).join("")}</div>
    <div class="band">
      <div>
        <h2>Never miss a new dispatch</h2>
        <p>Subscribe on YouTube for new country documentaries — new episodes filmed on location, most weeks.</p>
      </div>
      <div class="cta" style="margin:0;">
        <a class="btn btn-yt" target="_blank" rel="noopener" href="${SUB_URL}">Subscribe free</a>
        <a class="btn btn-ghost" target="_blank" rel="noopener" href="${CHANNEL_URL}">${watchIcon}Visit channel</a>
      </div>
    </div>
  </section>`;
}

function renderVideos(){
  return `
  <div class="page-head">
    <div class="eyebrow u">${VIDEOS.length} episodes</div>
    <h1>Latest Videos</h1>
    <p>Every country documentary from Global Travel Guide, newest first — synced automatically from the channel.</p>
  </div>
  <section class="block" style="padding-top:20px;">
    <div class="grid">${VIDEOS.map(v => cardHTML(v)).join("")}</div>
  </section>`;
}

function renderVideo(id){
  const v = VIDEOS.find(x => x.id === id);
  if(!v){ location.hash = "#/videos"; return ""; }
  const others = VIDEOS.filter(x => x.id !== id).slice(0,3);
  return `
  <a class="back" href="#/videos">← Back to all documentaries</a>
  <div class="detail-tag">${countryTag(v.title)}</div>
  <div class="detail-hero">
    <img src="${v.thumbnail}" alt="${esc(v.title)}">
    <a class="play" target="_blank" rel="noopener" href="${watchUrl(v.id)}" aria-label="Watch on YouTube"><span class="play-btn">${playIcon}</span></a>
  </div>
  <h1 class="detail-title">${esc(v.title)}</h1>
  <div class="detail-meta">
    <span class="mono">${fmtFull(v.published)}</span>
    <span>${fmtViews(v.views)}</span>
  </div>
  ${v.excerpt ? `<p class="detail-excerpt">${esc(v.excerpt)}</p>` : ""}
  <div class="detail-cta">
    <a class="btn btn-yt" target="_blank" rel="noopener" href="${watchUrl(v.id)}">${watchIcon}Watch on YouTube</a>
    <a class="btn btn-brass" target="_blank" rel="noopener" href="${SUB_URL}">Subscribe</a>
  </div>
  <section class="block" style="padding-top:0;">
    <div class="block-head"><h2>More dispatches</h2></div>
    <div class="grid">${others.map(o => cardHTML(o)).join("")}</div>
  </section>`;
}

function setActiveNav(route){
  document.querySelectorAll('#mainNav a').forEach(a => {
    a.classList.toggle('active', a.dataset.route === route);
  });
}

function route(){
  if(!VIDEOS.length){ return; }
  const hash = location.hash.replace(/^#\/?/, '');
  const app = document.getElementById('app');
  if(hash.startsWith('video/')){
    app.innerHTML = renderVideo(hash.slice(6));
    setActiveNav('videos');
    const v = VIDEOS.find(x => x.id === hash.slice(6));
    document.title = v ? `${v.title} — Global Travel Guide` : "Global Travel Guide";
  } else if(hash === 'videos'){
    app.innerHTML = renderVideos();
    setActiveNav('videos');
    document.title = "Latest Videos — Global Travel Guide";
  } else {
    app.innerHTML = renderHome();
    setActiveNav('home');
    document.title = "Global Travel Guide — Country Documentaries";
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);
document.getElementById('year').textContent = new Date().getFullYear();

fetch('videos.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    VIDEOS = data.sort((a,b) => new Date(b.published) - new Date(a.published));
    route();
  })
  .catch(() => {
    document.getElementById('app').innerHTML = '<div class="state">Could not load videos right now — please refresh.</div>';
  });
</script>

</body>
</html>
