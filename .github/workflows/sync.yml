name: Sync latest videos from YouTube

on:
  schedule:
    - cron: "4 2 * * *"  # once a day — a single plain read of the channel's public RSS feed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch channel feed and update videos.json
        run: node scripts/sync-videos.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Sync latest videos from YouTube"
          git push
